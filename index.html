<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency converter app</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
</head>
<body>


    <div class="container">
        <h1 style="display: flex; justify-content: center; align-items: center;">Currency Converter</h1>

        <form action="">

            <div class="amount">
                <p1>Enter Amount</p1>
                <input  value="100" type="text"/>
            </div>





            <div class="dropdown">

                <!-- from dropdown -->
                <div class="from">
                    <p>From</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png">
                        <select name="from">
                            <!-- <option value="USD">USD</option>
                            <option value="INR">INR</option>
                            <option value="EUR">EUR</option> -->
                        </select>

                    </div>
                </div>

                <i class="fa-solid fa-repeat"></i>


                <!-- to dropdown -->
                 <div class="to">
                    <p>To</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png">
                        <select name="to">
                            <!-- <option value="USD">USD</option>
                            <option value="INR" selected>INR</option>
                            <option value="EUR">EUR</option> -->
                        </select>
                    </div>

                 </div>

            </div>




            <div class="msg"> 1 USD = 90 INR</div>
            <button>Get exchange </button>

        </form>



    </div>
    
    <script src="codes.js"></script>
    <script src="app.js"></script>
</body>
</html>
